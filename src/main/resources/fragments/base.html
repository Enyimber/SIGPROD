<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
 
<!-- ═══════════════════════════════════════════════
     FRAGMENTO: head (meta, CSS, título)
     Uso: th:replace="~{fragments/base :: head(titulo='Proyectos')}"
════════════════════════════════════════════════ -->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${titulo} + ' – SIGPROD'">SIGPROD</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <!-- CSS propio -->
  <link rel="stylesheet" th:href="@{/css/sigprod.css}"/>
</head>
 
<!-- ═══════════════════════════════════════════════
     FRAGMENTO: navbar superior
════════════════════════════════════════════════ -->
<nav th:fragment="navbar" class="navbar navbar-dark bg-primary navbar-expand-lg px-3 py-2 shadow-sm">
  <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
    <i class="bi bi-code-square me-1"></i>SIGPROD
  </a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMain">
    <ul class="navbar-nav me-auto">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/proyectos}"><i class="bi bi-kanban me-1"></i>Proyectos</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/tareas/mis-tareas}"><i class="bi bi-check2-square me-1"></i>Mis tareas</a>
      </li>
      <li class="nav-item" sec:authorize="hasRole('ADMIN')">
        <a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-people me-1"></i>Usuarios</a>
      </li>
    </ul>
    <ul class="navbar-nav ms-auto align-items-center">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
          <i class="bi bi-person-circle me-1"></i>
          <span sec:authentication="name">Usuario</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" th:href="@{/auth/logout}">
            <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
          </a></li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
 
<!-- ═══════════════════════════════════════════════
     FRAGMENTO: alertas flash
════════════════════════════════════════════════ -->
<div th:fragment="alertas">
  <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show m-3" role="alert">
    <i class="bi bi-check-circle me-1"></i>
    <span th:text="${successMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show m-3" role="alert">
    <i class="bi bi-exclamation-triangle me-1"></i>
    <span th:text="${errorMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${warningMsg}" class="alert alert-warning alert-dismissible fade show m-3" role="alert">
    <i class="bi bi-exclamation-circle me-1"></i>
    <span th:text="${warningMsg}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>
 
<!-- ═══════════════════════════════════════════════
     FRAGMENTO: scripts (Bootstrap JS)
════════════════════════════════════════════════ -->
<div th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/sigprod.js}"></script>
</div>
 
</html>
