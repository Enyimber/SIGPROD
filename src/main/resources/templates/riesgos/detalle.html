<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Riesgo')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:720px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
      <li class="breadcrumb-item"><a th:href="@{/proyectos/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">Proyecto</a></li>
      <li class="breadcrumb-item"><a th:href="@{/riesgos/proyecto/{id}(id=${proyecto.id})}">Riesgos</a></li>
      <li class="breadcrumb-item active">Detalle</li>
    </ol>
  </nav>
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-3" th:text="${riesgo.descripcion}">Riesgo</h5>
      <div class="row g-3 mb-4">
        <div class="col-md-4 text-center">
          <div class="rounded-3 bg-warning bg-opacity-10 p-3">
            <p class="text-muted small mb-1">Probabilidad</p>
            <h3 class="fw-bold text-warning mb-0" th:text="${riesgo.probabilidad} + '/5'">0/5</h3>
          </div>
        </div>
        <div class="col-md-4 text-center">
          <div class="rounded-3 bg-danger bg-opacity-10 p-3">
            <p class="text-muted small mb-1">Impacto</p>
            <h3 class="fw-bold text-danger mb-0" th:text="${riesgo.impacto} + '/5'">0/5</h3>
          </div>
        </div>
        <div class="col-md-4 text-center">
          <div class="rounded-3 bg-dark bg-opacity-10 p-3">
            <p class="text-muted small mb-1">Criticidad</p>
            <h3 class="fw-bold mb-0" th:text="${riesgo.criticidad} + '/25'">0/25</h3>
          </div>
        </div>
      </div>
      <div class="mb-3" th:if="${riesgo.planMitigacion}">
        <strong>Plan de Mitigación:</strong>
        <p class="mt-1" th:text="${riesgo.planMitigacion}"></p>
      </div>
      <div class="d-flex gap-2 mt-4">
        <a th:href="@{/riesgos/{id}/editar(id=${riesgo.id})}" class="btn btn-outline-warning">
          <i class="bi bi-pencil me-1"></i>Editar
        </a>
        <form th:action="@{/riesgos/{id}/eliminar(id=${riesgo.id})}" method="post"
              onsubmit="return confirm('¿Eliminar este riesgo?')">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
