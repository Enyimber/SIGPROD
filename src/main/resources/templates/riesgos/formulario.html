<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Riesgo')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:640px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4"><i class="bi bi-exclamation-triangle text-warning me-2"></i>
        <span th:text="${riesgo.id == null ? 'Nuevo Riesgo' : 'Editar Riesgo'}">Riesgo</span>
      </h5>
      <form th:action="${riesgo.id == null ? '/sigprod/riesgos/proyecto/' + proyecto.id + '/nuevo' : '/sigprod/riesgos/' + riesgo.id + '/editar'}"
            th:object="${riesgo}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descripción del Riesgo <span class="text-danger">*</span></label>
          <textarea th:field="*{descripcion}" class="form-control" rows="3" required></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Probabilidad (1-5)</label>
            <input type="number" th:field="*{probabilidad}" class="form-control" min="1" max="5"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Impacto (1-5)</label>
            <input type="number" th:field="*{impacto}" class="form-control" min="1" max="5"/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Plan de Mitigación</label>
          <textarea th:field="*{planMitigacion}" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Responsable</label>
          <select th:field="*{responsableId}" class="form-select">
            <option value="">-- Sin asignar --</option>
            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombres + ' ' + u.apellidos}">Usuario</option>
          </select>
        </div>
        <div class="mb-4" th:if="${riesgo.id != null}">
          <label class="form-label fw-semibold">Estado</label>
          <select th:field="*{estado}" class="form-select">
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}">Estado</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning text-white"><i class="bi bi-save me-1"></i>Guardar</button>
          <a th:href="@{/riesgos/proyecto/{id}(id=${proyecto.id})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
