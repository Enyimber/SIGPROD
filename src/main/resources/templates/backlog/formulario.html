<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Nueva historia')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:700px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <nav aria-label="breadcrumb" class="mb-3"><ol class="breadcrumb small">
    <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
    <li class="breadcrumb-item"><a th:href="@{/backlog/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">P</a></li>
    <li class="breadcrumb-item active">Nueva historia</li>
  </ol></nav>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-white border-0 px-4 pt-4 pb-0">
      <h5 class="fw-bold mb-0"><i class="bi bi-journal-plus text-primary me-2"></i>Nueva historia de usuario</h5>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/backlog/{id}/nueva(id=${proyecto.id})}" th:object="${historia}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Título *</label>
            <input type="text" th:field="*{titulo}" class="form-control" placeholder="Título de la historia" required/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Narrativa</label>
            <textarea th:field="*{narrativa}" class="form-control" rows="3"
                      placeholder="Como [rol], quiero [funcionalidad], para [beneficio]..."></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Prioridad MoSCoW</label>
            <select th:field="*{prioridadMoscow}" class="form-select">
              <option value="">-- Seleccionar --</option>
              <option th:each="p:${prioridades}" th:value="${p.name()}" th:text="${p.name()}">P</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Story Points</label>
            <input type="number" th:field="*{estimacionPuntos}" class="form-control" min="1" max="100"/>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Valor negocio</label>
            <input type="number" th:field="*{valorNegocio}" class="form-control" min="1" max="100"/>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="bi bi-save me-1"></i>Crear historia</button>
          <a th:href="@{/backlog/{id}(id=${proyecto.id})}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
