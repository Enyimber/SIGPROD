<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Error')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-5 text-center">
  <i class="bi bi-exclamation-triangle text-warning" style="font-size:4rem"></i>
  <h2 class="fw-bold mt-3">Oops, algo salió mal</h2>
  <p class="text-muted" th:text="${errorMsg != null ? errorMsg : 'Ha ocurrido un error inesperado.'}">Error</p>
  <a th:href="@{/dashboard}" class="btn btn-primary mt-2">
    <i class="bi bi-house me-1"></i>Ir al Dashboard
  </a>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
