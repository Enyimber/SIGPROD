<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/base :: head('Sprint')}" ></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
      <li class="breadcrumb-item"><a th:href="@{/proyectos/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">Proyecto</a></li>
      <li class="breadcrumb-item"><a th:href="@{/sprints/proyecto/{id}(id=${proyecto.id})}">Sprints</a></li>
      <li class="breadcrumb-item active" th:text="'Sprint ' + ${sprint.numero}">Sprint</li>
    </ol>
  </nav>
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h4 class="fw-bold mb-0" th:text="'Sprint ' + ${sprint.numero} + ' — ' + ${sprint.objetivo}">Sprint</h4>
    <span class="badge fs-6"
          th:classappend="${sprint.estado.name() == 'ACTIVO'} ? 'bg-success' : (${sprint.estado.name() == 'COMPLETADO'} ? 'bg-secondary' : 'bg-primary')"
          th:text="${sprint.estado}">ESTADO</span>
  </div>
  <!-- Historias -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-header bg-transparent fw-semibold py-3">
      <i class="bi bi-journal-text me-2 text-primary"></i>Historias de usuario en este sprint
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>Título</th><th>Prioridad</th><th>Puntos</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            <tr th:each="h : ${historias}">
              <td th:text="${h.titulo}">Título</td>
              <td><span class="badge bg-primary" th:text="${h.prioridadMoscow}">MUST</span></td>
              <td th:text="${h.estimacionPuntos}">0</td>
              <td><span class="badge bg-secondary" th:text="${h.estado}">ESTADO</span></td>
              <td><a th:href="@{/backlog/historia/{id}(id=${h.id})}" class="btn btn-sm btn-outline-primary">Ver</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(historias)}">
              <td colspan="5" class="text-center text-muted py-4">No hay historias asignadas a este sprint.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
