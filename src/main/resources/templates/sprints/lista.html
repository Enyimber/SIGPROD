<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/base :: head('Sprints')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1">
          <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
          <li class="breadcrumb-item"><a th:href="@{/proyectos/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">Proyecto</a></li>
          <li class="breadcrumb-item active">Sprints</li>
        </ol>
      </nav>
      <h4 class="fw-bold mb-0"><i class="bi bi-lightning text-primary me-2"></i>Sprints</h4>
    </div>
    <a th:href="@{/sprints/proyecto/{id}/nuevo(id=${proyecto.id})}"
       sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')"
       class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i>Nuevo Sprint
    </a>
  </div>

  <div class="row g-3" th:if="${not #lists.isEmpty(sprints)}">
    <div class="col-md-6 col-lg-4" th:each="sprint : ${sprints}">
      <div class="card shadow-sm border-0 rounded-4 h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold mb-0" th:text="'Sprint ' + ${sprint.numero}">Sprint 1</h6>
            <span class="badge"
                  th:classappend="${sprint.estado.name() == 'ACTIVO'} ? 'bg-success' : (${sprint.estado.name() == 'COMPLETADO'} ? 'bg-secondary' : 'bg-primary')"
                  th:text="${sprint.estado}">ESTADO</span>
          </div>
          <p class="text-muted small mb-2" th:text="${sprint.objetivo}">Objetivo</p>
          <div class="d-flex gap-3 small text-muted mb-3">
            <span><i class="bi bi-calendar3 me-1"></i><span th:text="${sprint.fechaInicio}">inicio</span></span>
            <span><i class="bi bi-calendar-check me-1"></i><span th:text="${sprint.fechaFin}">fin</span></span>
          </div>
          <div class="d-flex gap-2">
            <a th:href="@{/sprints/{id}(id=${sprint.id})}" class="btn btn-sm btn-outline-primary">Ver detalle</a>
            <form th:if="${sprint.estado.name() == 'PLANIFICADO'}" th:action="@{/sprints/{id}/iniciar(id=${sprint.id})}" method="post" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-success">Iniciar</button>
            </form>
            <form th:if="${sprint.estado.name() == 'ACTIVO'}" th:action="@{/sprints/{id}/completar(id=${sprint.id})}" method="post" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-secondary">Completar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(sprints)}">
    <i class="bi bi-lightning fs-1 d-block mb-2 opacity-25"></i>
    <p>No hay sprints creados para este proyecto.</p>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
