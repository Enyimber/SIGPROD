<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Sprint')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:640px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
      <li class="breadcrumb-item"><a th:href="@{/proyectos/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">Proyecto</a></li>
      <li class="breadcrumb-item"><a th:href="@{/sprints/proyecto/{id}(id=${proyecto.id})}">Sprints</a></li>
      <li class="breadcrumb-item active" th:text="${sprint.id == null ? 'Nuevo sprint' : 'Editar sprint'}">Sprint</li>
    </ol>
  </nav>
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4" th:text="${sprint.id == null ? 'Nuevo Sprint' : 'Editar Sprint'}">Sprint</h5>
      <form th:action="${sprint.id == null ? '/sigprod/sprints/proyecto/' + proyecto.id + '/nuevo' : '/sigprod/sprints/' + sprint.id + '/editar'}"
            th:object="${sprint}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Objetivo del Sprint</label>
          <textarea th:field="*{objetivo}" class="form-control" rows="3" placeholder="¿Qué se logrará en este sprint?"></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Fecha inicio</label>
            <input type="date" th:field="*{fechaInicio}" class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Fecha fin</label>
            <input type="date" th:field="*{fechaFin}" class="form-control"/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Capacidad (horas)</label>
          <input type="number" th:field="*{capacidadHoras}" class="form-control" min="1" placeholder="Ej: 80"/>
        </div>
        <div class="mb-4" th:if="${sprint.id != null}">
          <label class="form-label fw-semibold">Estado</label>
          <select th:field="*{estado}" class="form-select">
            <option th:each="e : ${estados}" th:value="${e}" th:text="${e}">Estado</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Guardar</button>
          <a th:href="@{/sprints/proyecto/{id}(id=${proyecto.id})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
