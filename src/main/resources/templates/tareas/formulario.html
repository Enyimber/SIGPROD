<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Nueva tarea')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:680px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-white border-0 px-4 pt-4 pb-0">
      <h5 class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary me-2"></i>Nueva tarea</h5>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/tareas/historia/{id}/nueva(historiaId=${historia.id})}" th:object="${tarea}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Título *</label>
            <input type="text" th:field="*{titulo}" class="form-control" required/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tipo</label>
            <select th:field="*{tipo}" class="form-select">
              <option value="">-- Seleccionar --</option>
              <option th:each="t:${tipos}" th:value="${t.name()}" th:text="${t.name()}">T</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Asignar a</label>
            <select th:field="*{asignadoId}" class="form-select">
              <option value="">-- Sin asignar --</option>
              <option th:each="u:${usuarios}" th:value="${u.id}" th:text="${u.nombres+' '+u.apellidos}">U</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Horas estimadas</label>
            <input type="number" th:field="*{horasEstimadas}" class="form-control" min="1"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Fecha límite</label>
            <input type="date" th:field="*{fechaLimite}" class="form-control"/>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="bi bi-save me-1"></i>Crear tarea</button>
          <a th:href="@{/tareas/historia/{id}(historiaId=${historia.id})}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
