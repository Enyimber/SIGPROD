<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Kanban')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <h4 class="fw-bold mb-4"><i class="bi bi-kanban text-warning me-2"></i>Mi tablero Kanban</h4>
  <div class="row g-3 flex-nowrap overflow-auto pb-3">
    <div th:each="col : ${ {{'TODO','Por hacer','secondary'}, {'IN_PROGRESS','En progreso','primary'}, {'CODE_REVIEW','Code Review','info'}, {'TESTING','Testing','warning'}, {'DONE','Done','success'}} }"
         class="col-auto" style="min-width:250px;max-width:270px">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-header border-0 rounded-top-4 py-2 px-3"
             th:classappend="'bg-'+${col[2]}+' bg-opacity-10'">
          <span class="fw-semibold" th:text="${col[1]}">Col</span>
          <span class="badge ms-2" th:classappend="'bg-'+${col[2]}"
                th:text="${col[0]=='TODO'?todo.size():(col[0]=='IN_PROGRESS'?enProgreso.size():(col[0]=='CODE_REVIEW'?revision.size():(col[0]=='TESTING'?testing.size():done.size())))}">0</span>
        </div>
        <div class="card-body p-2 d-flex flex-column gap-2" style="overflow-y:auto;max-height:70vh">
          <div th:each="t : ${col[0]=='TODO'?todo:(col[0]=='IN_PROGRESS'?enProgreso:(col[0]=='CODE_REVIEW'?revision:(col[0]=='TESTING'?testing:done)))}"
               class="p-3 rounded-3 bg-white border">
            <p class="fw-semibold small mb-1" th:text="${t.titulo}">T</p>
            <span class="badge bg-secondary bg-opacity-10 text-secondary small" th:text="${t.tipo}">tipo</span>
            <div class="d-flex gap-1 mt-2 flex-wrap" th:if="${col[0]!='DONE'}">
              <a th:href="@{/tareas/{id}(id=${t.id})}" class="btn btn-outline-primary rounded-pill" style="font-size:.7rem;padding:.15rem .5rem"><i class="bi bi-eye"></i></a>
              <form th:action="@{/tareas/{id}/estado(id=${t.id})}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="estado"
                       th:value="${col[0]=='TODO'?'IN_PROGRESS':(col[0]=='IN_PROGRESS'?'CODE_REVIEW':(col[0]=='CODE_REVIEW'?'TESTING':'DONE'))}"/>
                <input type="hidden" name="origen" value="/tareas/mis-tareas"/>
                <button type="submit" class="btn btn-outline-success rounded-pill" style="font-size:.7rem;padding:.15rem .5rem">→</button>
              </form>
            </div>
          </div>
          <div th:if="${col[0]=='TODO'?todo.empty:(col[0]=='IN_PROGRESS'?enProgreso.empty:(col[0]=='CODE_REVIEW'?revision.empty:(col[0]=='TESTING'?testing.empty:done.empty)))}"
               class="text-muted text-center small py-3">Sin tareas</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
