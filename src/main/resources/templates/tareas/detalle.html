<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Tarea')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:760px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-white border-0 px-4 pt-4 pb-0 d-flex justify-content-between">
      <h5 class="fw-bold mb-0" th:text="${tarea.titulo}">Tarea</h5>
      <span class="badge rounded-pill"
            th:classappend="${tarea.estado.name()=='DONE'}?'bg-success':(${tarea.estado.name()=='IN_PROGRESS'}?'bg-primary':'bg-secondary')"
            th:text="${tarea.estado}">E</span>
    </div>
    <div class="card-body p-4">
      <p class="text-muted" th:text="${tarea.descripcion?:'Sin descripción.'}">D</p>
      <div class="row g-3 mb-3">
        <div class="col-md-3"><p class="text-muted small mb-0">Tipo</p>
          <span class="badge bg-secondary" th:text="${tarea.tipo}">T</span></div>
        <div class="col-md-3"><p class="text-muted small mb-0">Horas est.</p>
          <strong th:text="${tarea.horasEstimadas?:'-'}">-</strong></div>
        <div class="col-md-3"><p class="text-muted small mb-0">Horas reales</p>
          <strong th:text="${tarea.horasReales?:'-'}">-</strong></div>
        <div class="col-md-3"><p class="text-muted small mb-0">Fecha límite</p>
          <strong th:text="${tarea.fechaLimite!=null?#temporals.format(tarea.fechaLimite,'dd/MM/yyyy'):'--'}">-</strong></div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a th:href="@{/tareas/historia/{id}(historiaId=${tarea.historiaId})}" class="btn btn-outline-secondary rounded-pill">
          <i class="bi bi-arrow-left me-1"></i>Volver</a>
        <form th:action="@{/tareas/{id}/estado(id=${tarea.id})}" method="post" class="d-inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <select name="estado" class="form-select form-select-sm d-inline w-auto">
            <option th:each="e:${estados}" th:value="${e.name()}"
                    th:selected="${e.name()==tarea.estado.name()}" th:text="${e.name()}">E</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary rounded-pill ms-1">Cambiar estado</button>
        </form>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
