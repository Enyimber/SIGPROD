<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/base :: head('Proyecto')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-1">
        <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
        <li class="breadcrumb-item active" th:text="${proyecto.nombre}">Proyecto</li>
      </ol></nav>
      <h4 class="fw-bold mb-0" th:text="${proyecto.nombre}">Nombre</h4>
      <span class="badge bg-primary" th:text="${proyecto.metodologia}">SCRUM</span>
      <span class="badge"
            th:classappend="${proyecto.estado.name() == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
            th:text="${proyecto.estado}">ACTIVO</span>
    </div>
    <a th:href="@{/proyectos/{id}/editar(id=${proyecto.id})}"
       sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')"
       class="btn btn-outline-primary">
      <i class="bi bi-pencil me-1"></i>Editar
    </a>
  </div>

  <!-- Módulos del proyecto -->
  <div class="row g-3 mb-4">
    <!-- Backlog -->
    <div class="col-md-6 col-lg-3" sec:authorize="hasAnyRole('ADMIN','PRODUCT_OWNER','PROJECT_MANAGER','ANALISTA')">
      <a th:href="@{/backlog/{id}(id=${proyecto.id})}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 h-100 sigprod-quick-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="rounded-3 bg-primary bg-opacity-10 p-3">
              <i class="bi bi-journal-richtext text-primary fs-3"></i>
            </div>
            <div>
              <p class="text-muted small mb-0">Backlog</p>
              <h6 class="fw-bold mb-0" th:text="${historias.size()} + ' historias'">0 historias</h6>
            </div>
          </div>
        </div>
      </a>
    </div>
    <!-- Sprints -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/sprints/proyecto/{id}(id=${proyecto.id})}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 h-100 sigprod-quick-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="rounded-3 bg-success bg-opacity-10 p-3">
              <i class="bi bi-lightning text-success fs-3"></i>
            </div>
            <div>
              <p class="text-muted small mb-0">Sprints</p>
              <h6 class="fw-bold mb-0" th:text="${sprints.size()} + ' sprints'">0 sprints</h6>
            </div>
          </div>
        </div>
      </a>
    </div>
    <!-- Riesgos -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/riesgos/proyecto/{id}(id=${proyecto.id})}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 h-100 sigprod-quick-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="rounded-3 bg-warning bg-opacity-10 p-3">
              <i class="bi bi-exclamation-triangle text-warning fs-3"></i>
            </div>
            <div>
              <p class="text-muted small mb-0">Riesgos</p>
              <h6 class="fw-bold mb-0" th:text="${riesgos.size()} + ' riesgos'">0 riesgos</h6>
            </div>
          </div>
        </div>
      </a>
    </div>
    <!-- Defectos -->
    <div class="col-md-6 col-lg-3">
      <a th:href="@{/defectos/proyecto/{id}(id=${proyecto.id})}" class="text-decoration-none">
        <div class="card border-0 shadow-sm rounded-4 h-100 sigprod-quick-card">
          <div class="card-body d-flex align-items-center gap-3">
            <div class="rounded-3 bg-danger bg-opacity-10 p-3">
              <i class="bi bi-bug text-danger fs-3"></i>
            </div>
            <div>
              <p class="text-muted small mb-0">Defectos</p>
              <h6 class="fw-bold mb-0">Ver defectos</h6>
            </div>
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- Info del proyecto -->
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-transparent fw-semibold py-3">
          <i class="bi bi-info-circle me-2 text-primary"></i>Información General
        </div>
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-sm-4 text-muted">Cliente</dt>
            <dd class="col-sm-8" th:text="${proyecto.cliente}">-</dd>
            <dt class="col-sm-4 text-muted">Inicio</dt>
            <dd class="col-sm-8" th:text="${proyecto.fechaInicio}">-</dd>
            <dt class="col-sm-4 text-muted">Fin</dt>
            <dd class="col-sm-8" th:text="${proyecto.fechaFin}">-</dd>
            <dt class="col-sm-4 text-muted">Presupuesto</dt>
            <dd class="col-sm-8" th:text="${#numbers.formatDecimal(proyecto.presupuesto ?: 0, 1, 'COMMA', 0, 'POINT')}">0</dd>
            <dt class="col-sm-4 text-muted">Descripción</dt>
            <dd class="col-sm-8" th:text="${proyecto.descripcion}">-</dd>
          </dl>
        </div>
      </div>
    </div>
    <!-- Equipo del proyecto -->
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
          <span class="fw-semibold"><i class="bi bi-people me-2 text-primary"></i>Equipo</span>
          <form sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')"
                th:action="@{/proyectos/{id}/miembros(id=${proyecto.id})}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input-group input-group-sm">
              <select name="usuarioId" class="form-select form-select-sm" style="width:140px">
                <option value="">Usuario...</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombres}">U</option>
              </select>
              <input type="text" name="rolEnProyecto" class="form-control form-control-sm" placeholder="Rol" style="width:80px"/>
              <button type="submit" class="btn btn-sm btn-primary">+</button>
            </div>
          </form>
        </div>
        <div class="card-body p-0">
          <div class="list-group list-group-flush">
            <div th:each="m : ${proyecto.miembros}" class="list-group-item d-flex justify-content-between align-items-center py-2">
              <span th:text="${m.usuarioId}"><small>ID</small></span>
              <span class="badge bg-primary" th:text="${m.rolEnProyecto}">ROL</span>
            </div>
            <div th:if="${#lists.isEmpty(proyecto.miembros)}" class="list-group-item text-muted text-center py-3 small">
              Sin miembros asignados.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
