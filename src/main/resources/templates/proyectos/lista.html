<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head th:replace="~{fragments/base :: head('Proyectos')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-kanban text-primary me-2"></i>Proyectos</h4>
    <a th:href="@{/proyectos/nuevo}" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')"
       class="btn btn-primary rounded-pill px-4"><i class="bi bi-plus-lg me-1"></i>Nuevo proyecto</a>
  </div>
  <div th:if="${proyectos.empty}" class="text-center text-muted py-5">
    <i class="bi bi-inbox fs-1 d-block mb-3"></i><p>No hay proyectos registrados aún.</p>
    <a th:href="@{/proyectos/nuevo}" class="btn btn-primary rounded-pill">Crear primer proyecto</a>
  </div>
  <div class="row g-4" th:unless="${proyectos.empty}">
    <div class="col-12 col-md-6 col-xl-4" th:each="p : ${proyectos}">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between mb-3">
            <span class="badge rounded-pill"
                  th:classappend="${p.estado.name()=='ACTIVO'}?'bg-success':(${p.estado.name()=='PAUSADO'}?'bg-warning text-dark':'bg-secondary')"
                  th:text="${p.estado}">Estado</span>
            <span class="badge bg-light text-dark border" th:text="${p.metodologia}">Met.</span>
          </div>
          <h5 class="fw-bold mb-1">
            <a th:href="@{/proyectos/{id}(id=${p.id})}" class="text-decoration-none text-dark stretched-link"
               th:text="${p.nombre}">Nombre</a>
          </h5>
          <p class="text-muted small mb-2"><i class="bi bi-building me-1"></i><span th:text="${p.cliente}">Cliente</span></p>
          <p class="text-muted small" th:text="${#strings.abbreviate(p.descripcion?:'',90)}">Desc.</p>
          <div class="d-flex gap-3 small text-muted mt-2">
            <span><i class="bi bi-calendar-event me-1"></i><span th:text="${p.fechaInicio!=null?#temporals.format(p.fechaInicio,'dd/MM/yy'):'--'}"></span></span>
            <span><i class="bi bi-calendar-check me-1"></i><span th:text="${p.fechaFin!=null?#temporals.format(p.fechaFin,'dd/MM/yy'):'--'}"></span></span>
          </div>
        </div>
        <div class="card-footer bg-white border-0 px-4 pb-3 d-flex gap-2">
          <a th:href="@{/proyectos/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary rounded-pill"><i class="bi bi-eye me-1"></i>Ver</a>
          <a th:href="@{/proyectos/{id}/editar(id=${p.id})}" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')"
             class="btn btn-sm btn-outline-secondary rounded-pill"><i class="bi bi-pencil me-1"></i>Editar</a>
          <form th:action="@{/proyectos/{id}/eliminar(id=${p.id})}" method="post" class="ms-auto"
                sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('¿Eliminar proyecto?')">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill"><i class="bi bi-trash"></i></button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
