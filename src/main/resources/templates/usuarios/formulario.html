<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Usuario')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:600px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-white border-0 px-4 pt-4 pb-0">
      <h5 class="fw-bold mb-0"><i class="bi bi-person-gear text-primary me-2"></i>
        <span th:text="${usuario.id!=null?'Editar usuario':'Nuevo usuario'}">U</span></h5>
    </div>
    <div class="card-body p-4">
      <div th:if="${errorMsg}" class="alert alert-danger py-2" th:text="${errorMsg}"></div>
      <form th:action="${usuario.id!=null?'/usuarios/'+usuario.id+'/editar':'/usuarios/nuevo'}"
            th:object="${usuario}" method="post" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombres *</label>
            <input type="text" th:field="*{nombres}" class="form-control" required/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Apellidos *</label>
            <input type="text" th:field="*{apellidos}" class="form-control" required/>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Correo *</label>
            <input type="email" th:field="*{correo}" class="form-control" th:readonly="${usuario.id!=null}" required/>
          </div>
          <div class="col-12" th:if="${usuario.id==null}">
            <label class="form-label fw-semibold">Contraseña *</label>
            <input type="password" th:field="*{passwordHash}" class="form-control" placeholder="Mínimo 8 caracteres"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Teléfono</label>
            <input type="tel" th:field="*{telefono}" class="form-control"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Rol *</label>
            <select th:field="*{rolSistema}" class="form-select" required>
              <option value="">-- Seleccionar --</option>
              <option th:each="r:${roles}" th:value="${r.name()}" th:text="${r.name()}">R</option>
            </select>
          </div>
          <div class="col-12" th:if="${usuario.id!=null}">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" th:field="*{activo}" role="switch"/>
              <label class="form-check-label fw-semibold">Usuario activo</label>
            </div>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-save me-1"></i><span th:text="${usuario.id!=null?'Guardar cambios':'Crear usuario'}">G</span>
          </button>
          <a th:href="@{/usuarios}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
