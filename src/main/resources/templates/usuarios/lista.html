<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Usuarios')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container-fluid py-4 px-4">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-people text-danger me-2"></i>Gestión de usuarios</h4>
    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary rounded-pill px-4"><i class="bi bi-person-plus me-1"></i>Nuevo usuario</a>
  </div>
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light"><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
          <tbody>
            <tr th:each="u:${usuarios}">
              <td class="fw-semibold" th:text="${u.nombres+' '+u.apellidos}">N</td>
              <td class="small" th:text="${u.correo}">e</td>
              <td><span class="badge bg-primary bg-opacity-10 text-primary" th:text="${u.rolSistema}">R</span></td>
              <td><span th:if="${u.activo}" class="badge bg-success">Activo</span>
                  <span th:unless="${u.activo}" class="badge bg-secondary">Inactivo</span></td>
              <td class="text-end">
                <div class="d-flex gap-1 justify-content-end">
                  <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary rounded-pill"><i class="bi bi-pencil"></i></a>
                  <form th:if="${u.activo}" th:action="@{/usuarios/{id}/desactivar(id=${u.id})}" method="post" onsubmit="return confirm('¿Desactivar?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-warning rounded-pill"><i class="bi bi-person-dash"></i></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
