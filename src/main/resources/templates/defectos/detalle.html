<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Defecto')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:720px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/proyectos}">Proyectos</a></li>
      <li class="breadcrumb-item"><a th:href="@{/proyectos/{id}(id=${proyecto.id})}" th:text="${proyecto.nombre}">Proyecto</a></li>
      <li class="breadcrumb-item"><a th:href="@{/defectos/proyecto/{id}(id=${proyecto.id})}">Defectos</a></li>
      <li class="breadcrumb-item active" th:text="${defecto.titulo}">Defecto</li>
    </ol>
  </nav>
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <h5 class="fw-bold" th:text="${defecto.titulo}">Defecto</h5>
        <span class="badge fs-6"
              th:classappend="${defecto.severidad.name() == 'CRITICO'} ? 'bg-danger' : 'bg-warning text-dark'"
              th:text="${defecto.severidad}">SEV</span>
      </div>
      <p th:text="${defecto.descripcion}" class="text-muted"></p>
      <div class="mb-3" th:if="${defecto.pasosReproduccion}">
        <strong>Pasos para reproducir:</strong>
        <pre class="bg-light p-3 rounded small" th:text="${defecto.pasosReproduccion}"></pre>
      </div>
      <!-- Cambiar estado -->
      <div class="d-flex gap-2 mt-4 flex-wrap">
        <form th:each="e : ${estados}" th:action="@{/defectos/{id}/estado(id=${defecto.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <input type="hidden" name="estado" th:value="${e}"/>
          <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${e}">Estado</button>
        </form>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
