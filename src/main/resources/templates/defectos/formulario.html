<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Reportar Defecto')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container py-4" style="max-width:720px">
  <div th:replace="~{fragments/base :: alertas}"></div>
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <h5 class="fw-bold mb-4"><i class="bi bi-bug-fill text-danger me-2"></i>Reportar Defecto</h5>
      <form th:action="@{/defectos/proyecto/{id}/nuevo(id=${proyecto.id})}" th:object="${defecto}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{reportadoPorId}"/>
        <div class="mb-3">
          <label class="form-label fw-semibold">Título <span class="text-danger">*</span></label>
          <input type="text" th:field="*{titulo}" class="form-control" placeholder="Descripción breve del defecto" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Descripción</label>
          <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Pasos para reproducir</label>
          <textarea th:field="*{pasosReproduccion}" class="form-control" rows="3" placeholder="1. ...\n2. ...\n3. ..."></textarea>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Severidad</label>
            <select th:field="*{severidad}" class="form-select">
              <option value="">-- Seleccione --</option>
              <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}">SEV</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Prioridad</label>
            <select th:field="*{prioridad}" class="form-select">
              <option value="">-- Seleccione --</option>
              <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}">PRI</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Ambiente</label>
            <input type="text" th:field="*{ambiente}" class="form-control" placeholder="dev / staging / prod"/>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Asignar a</label>
          <select th:field="*{asignadoAId}" class="form-select">
            <option value="">-- Sin asignar --</option>
            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombres + ' ' + u.apellidos}">Usuario</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger"><i class="bi bi-save me-1"></i>Reportar</button>
          <a th:href="@{/defectos/proyecto/{id}(id=${proyecto.id})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
