<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Iniciar sesión')}"></head>
<body class="bg-light">
 
<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-100">
    <div class="col-12 col-md-5 col-lg-4 mx-auto">
 
      <!-- Logo / título -->
      <div class="text-center mb-4">
        <i class="bi bi-code-square text-primary" style="font-size:3rem"></i>
        <h2 class="fw-bold mt-2">SIGPROD</h2>
        <p class="text-muted">TechSoft Solutions S.A.S.</p>
      </div>
 
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
          <h5 class="card-title mb-4 fw-semibold">Iniciar sesión</h5>
 
          <!-- Mensajes flash -->
          <div th:if="${errorMsg}" class="alert alert-danger py-2">
            <i class="bi bi-exclamation-triangle me-1"></i>
            <span th:text="${errorMsg}"></span>
          </div>
          <div th:if="${logoutMsg}" class="alert alert-info py-2">
            <i class="bi bi-info-circle me-1"></i>
            <span th:text="${logoutMsg}"></span>
          </div>
 
          <!-- Formulario -->
          <form th:action="@{/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
 
            <div class="mb-3">
              <label class="form-label fw-semibold" for="correo">Correo electrónico</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="correo" name="correo"
                       class="form-control" placeholder="correo@techsoft.com"
                       autocomplete="email" required/>
              </div>
            </div>
 
            <div class="mb-3">
              <label class="form-label fw-semibold" for="password">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="••••••••"
                       autocomplete="current-password" required/>
              </div>
            </div>
 
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me"/>
              <label class="form-check-label" for="remember-me">Recordarme</label>
            </div>
 
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
            </button>
          </form>
 
          <hr class="my-3"/>
          <p class="text-center text-muted small mb-0">
            ¿No tienes cuenta?
            <a th:href="@{/auth/registro}" class="text-primary fw-semibold">Registrarse</a>
          </p>
        </div>
      </div>
 
      <p class="text-center text-muted small mt-3">
        &copy; 2026 TechSoft Solutions · UTS Bucaramanga
      </p>
    </div>
  </div>
</div>
 
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
