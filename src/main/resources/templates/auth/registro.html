<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/base :: head('Registro')}"></head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6">
 
      <div class="text-center mb-4">
        <i class="bi bi-person-plus text-primary" style="font-size:2.5rem"></i>
        <h3 class="fw-bold mt-2">Crear cuenta</h3>
      </div>
 
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
 
          <div th:if="${errorMsg}" class="alert alert-danger py-2" th:text="${errorMsg}"></div>
 
          <form th:action="@{/auth/registro}" th:object="${usuario}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
 
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Nombres</label>
                <input type="text" th:field="*{nombres}"
                       class="form-control" th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'"
                       placeholder="Nombres" required/>
                <div class="invalid-feedback" th:errors="*{nombres}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Apellidos</label>
                <input type="text" th:field="*{apellidos}"
                       class="form-control" th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"
                       placeholder="Apellidos" required/>
                <div class="invalid-feedback" th:errors="*{apellidos}"></div>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <input type="email" th:field="*{correo}"
                       class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                       placeholder="correo@techsoft.com" required/>
                <div class="invalid-feedback" th:errors="*{correo}"></div>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" th:field="*{passwordHash}"
                       class="form-control" placeholder="Mínimo 8 caracteres" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="tel" th:field="*{telefono}" class="form-control" placeholder="300 000 0000"/>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Rol en el sistema</label>
                <select th:field="*{rolSistema}" class="form-select" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="rol : ${roles}"
                          th:value="${rol.name()}"
                          th:text="${rol.name()}"></option>
                </select>
              </div>
            </div>
 
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary py-2 fw-semibold">
                <i class="bi bi-person-check me-1"></i>Registrarse
              </button>
            </div>
          </form>
 
          <p class="text-center text-muted small mt-3 mb-0">
            ¿Ya tienes cuenta?
            <a th:href="@{/auth/login}" class="text-primary fw-semibold">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/base :: scripts}"></div>
</body>
</html>
